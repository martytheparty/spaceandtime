<div class="wrapper">
    <mat-form-field>
  <mat-label>Filter</mat-label>
  <input #filter matInput (keyup)="applyFilter(filter.value)" placeholder="Ex. ium" #input>
</mat-form-field>
    <table mat-table
        [dataSource]="dataSource"
        multiTemplateDataRows
    >
        <ng-container matColumnDef="stId">
            <th mat-header-cell *matHeaderCellDef> ST ID </th>
            <td mat-cell *matCellDef="let stRecord"> 
                <span [attr.data-cy-entitity-table-st-id]="stRecord.stId">{{stRecord.stId}}</span>
            </td>
        </ng-container>
        <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef> Type </th>
            <td mat-cell *matCellDef="let stRecord"> {{stRecord.type}} </td>
        </ng-container>
        <ng-container matColumnDef="json">
            <th mat-header-cell *matHeaderCellDef> JSON </th>
            <td mat-cell *matCellDef="let stRecord"> {{stRecord.json}} </td>
        </ng-container>
        <ng-container matColumnDef="expandedDetail">
            <td mat-cell *matCellDef="let row"
                [attr.colspan]="displayedColumns.length">
                <div class="detail-content">
                    @if(expandedRows[row.stId]) {
                        {{ row.json }}
                    }
                </div>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row 
            *matRowDef="let row; columns: displayedColumns;"
            class="st-row"
            tabindex="0"
            (click)="toggleRow(row)"
            (keydown.enter)="toggleRow(row)"
        ></tr>
        <tr mat-row 
            *matRowDef="let row; columns: ['expandedDetail']"
            class="expanded-detail-row"
            [ngClass] = "{ 'expanded': expandedRows[row.stId] }"
        ></tr>

    </table>
</div>
